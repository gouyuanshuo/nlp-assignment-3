name = "transformer-text-vision"
[model]
name = "transformer"
d_model = 256
hidden_dim = 256
n_layers = 2
n_heads = 4
ff_dim = 512
dropout = 0.1
modality_embeddings = true
positions = true
pooling = "cls"
modalities = ["text", "vision"]
[training]
epochs = 30
batch_size = 32
learning_rate = 0.0003
weight_decay = 0.0001
patience = 6
seed = 1111
device = "auto"
