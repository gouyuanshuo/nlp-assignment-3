[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosei-transformer-fusion"
version = "0.1.0"
description = "Reproducible CMU-MOSEI binary sentiment experiments for Assignment 3"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
mosei = "mosei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
